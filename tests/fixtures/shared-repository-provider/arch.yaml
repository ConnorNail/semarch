version: 1
include: ["src/**/*.ts"]
domains:
  users:
    match: ["src/**/user.*.ts"]
  billing:
    match: ["src/**/billing.*.ts"]
  inventory:
    match: ["src/**/inventory.*.ts"]
components:
  service:
    match: ["**/*.service.ts"]
  repository:
    match: ["**/*.repository.ts"]
  transport:
    match: ["src/transport/**/*.ts"]
rules:
  - deny: service -> foreign.repository
