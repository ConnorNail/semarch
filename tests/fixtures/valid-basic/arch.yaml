version: 1
include: ["src/**/*.{ts,tsx}"]
domains:
  users:
    root: src/users
  billing:
    root: src/billing
components:
  service:
    match: ["**/services/**/*.ts"]
  repository:
    match: ["**/repositories/**/*.{ts,tsx}"]
  transport:
    match: ["src/transport/**/*.ts"]
rules:
  - deny: service -> transport
  - deny: service -> foreign.repository
